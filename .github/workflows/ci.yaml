# CI workflow for PIME
# Calls the reusable build-and-sign workflow with different signing policies:
#   - CI builds (non-tag): test-signing, no approval required
#   - Release builds (tag): release-signing, requires production environment approval

name: Build

on:
  push:
    # A fork holds none of the SignPath secrets, so build-and-sign can only fail
    # there, and a mail per pushed branch is noise for a `win/*` branch that
    # exists to be fetched rather than built. Branch pushes are therefore the
    # integration branch only; PR builds go through `pull_request` and release
    # builds through the tag list below.
    branches: ['master']
    tags: ['v*']
    # Docs and agent notes cannot change the build output. Tag pushes ignore
    # these filters, so release builds are unaffected.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:

# The called workflow's job requests contents: write (GitHub Release) and
# id-token: write (SignPath OIDC). A caller that omits `permissions` grants
# contents: read + id-token: none, and GitHub rejects the whole run at startup
# ("The nested job ... is requesting ... but is only allowed ...").
permissions:
  contents: write
  id-token: write

jobs:
  linux-checks:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # libIME2 carries the vendored gtest the C++ helper tests compile; brise
      # carries the preset the ADR cites by path, and test_agent_docs resolves
      # that reference against the working tree.
      - name: Check out the C++ test dependency
        # Shallow: the layer reads the files, never the history, and libIME2
        # carries the whole vendored gtest tree.
        run: git submodule update --init --depth 1 libIME2 python/input_methods/rime/brise
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-backend/go.mod
          # The toolchain download and the two Go caches come back from the
          # cache on the second push; the module cache is the one that matters,
          # `go-backend` pulls its deps from the proxy on a cold runner.
          cache: true
      - name: Install Bun for the GitHub YAML check
        uses: oven-sh/setup-bun@v2
      # 501 s of the 568 s green job (run 43061539705) is this fetch, and the
      # whole of it is five .deb files plus one wheel, so both halves are
      # staged in the Actions cache and the index refresh is skipped on a hit.
      # The key is the hash of this file, which is where the package list
      # lives: edit the list and the key moves with it.
      - name: Restore the apt archives and index
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yaml') }}
      - name: Restore the pip wheel cache
        id: pip-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yaml') }}
      - name: Install IME smoke test and shell lint dependencies
        # ruff ships no apt package on the runner image (26.04), so the lint
        # layer takes it from pip; the other five are apt packages. The two
        # native libraries are what the ctypes bindings dlopen: libchewing.so.3
        # and librime.so.
        # The short timeout with three retries is what makes a transient
        # `Temporary failure resolving 'archive.ubuntu.com'` on the hosted
        # runner self-heal inside the step instead of reddening the whole run
        # (observed on run 43041517344, twice in a row, while
        # packages.microsoft.com resolved on the same job).
        # `--no-install-recommends` keeps python3-pip's recommend chain out of
        # the step; the five named packages are all the layer reads, so the
        # chain buys nothing here.
        # A restored `/var/lib/apt/lists` answers resolution, so `update` runs
        # only on a cold cache; that is the 20 s-per-name DNS round that the
        # degraded runner repeats for every URI.
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != 'true' ]; then
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=5
          fi
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=5 \
            libopencc-dev shellcheck python3-pip libchewing3 librime-dev
          python3 -m pip install --user --break-system-packages ruff
      - name: Run every locally verifiable layer
        run: tests/run_local_tests.sh

  ci:
    # SignPath secrets live in the upstream repository only, so on a fork this
    # call fails at startup and mails a failure for every push to master. The
    # linux-checks job above still runs there, which is the signal a fork can
    # produce; a fork PR still builds in the upstream run.
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.repository == 'EasyIME/PIME' }}
    uses: ./.github/workflows/build-and-sign.yaml
    with:
      signing-policy: test-signing
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-and-sign.yaml
    with:
      signing-policy: release-signing
      environment: production
      create-release: true
    secrets: inherit
