# Static checks for the hand-written HTML under docs/ and the README's build
# contract. Kept separate from ci.yaml: that workflow ignores docs-only
# changes, so a guardrail living there would never run when a page breaks.

name: Docs checks

on:
  push:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'build.bat'
      - 'appveyor.after_build.bat'
      - 'tests/test_docs_pages.py'
      - 'tests/test_readme_contract.py'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'build.bat'
      - 'appveyor.after_build.bat'
      - 'tests/test_docs_pages.py'
      - 'tests/test_readme_contract.py'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check local links and ARIA references
        run: python3 -m unittest discover -s tests -p 'test_docs_pages.py' -v
      - name: Check README build steps
        run: python3 -m unittest discover -s tests -p 'test_readme_contract.py' -v
