# The Python lint layer's committed config, shared by tests/verify_windows.sh,
# tests/run_local_tests.sh and the linux-checks job so all three agree
# (docs/agents/windows-toolchain.md, docs/agents/verification.md).
#
# Error-class rules only: F (pyflakes — unused imports, undefined names,
# duplicate keys) and E9 (syntax/indent errors). The style rules (W, the rest
# of E) stay deferred until this set holds; the measured per-rule tally behind
# that split is recorded in docs/agents/windows-toolchain.md.
#
# Generated by omp (Qwen3.8-Flash-Next) without human creative authorship.
# SPDX-License-Identifier: LGPL-2.1-or-later

# Vendored interpreter tree plus its site-packages: not this repo's code.
# (Top-level like ruff wants it; not a [lint] key.)
extend-exclude = ["python/python3"]

[lint]
select = ["F", "E9"]
# Star-import pairs, off by measurement: the codebase's binding style is
# `from ctypes import *` / `from keycodes import *` (the spec's "checks the
# codebase already keeps by hand"), so the two heuristic codes 815 of the
# first run's 895 findings with no undefined name among them.
ignore = ["F403", "F405"]

[lint.per-file-ignores]
# Package façades: the re-exports are the file's purpose (ruff's own
# recommended form for F401 on __init__.py).
"python/**/__init__.py" = ["F401"]
